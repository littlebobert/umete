<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dropdowns inside labels</title></head>
<body>
  <!-- Umete's own fixture: state and country dropdowns wrapped in their labels,
       worded differently from the remembered form. -->
  <form>
    <label>State or province
      <select name="region">
        <option value="">Choose</option>
        <option value="CA">California</option>
        <option value="WA">Washington</option>
      </select>
    </label>
    <label>Country
      <select name="nation">
        <option value="CA">Canada</option>
        <option value="US">United States</option>
      </select>
    </label>
  </form>
</body>
</html>
