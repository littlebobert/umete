<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Split phone boxes</title></head>
<body>
  <!-- Umete's own fixture: phone numbers split across boxes sized for their parts. -->
  <form>
    <table>
      <tr><th><label>Day phone:</label></th>
        <td>(<input type="text" name="dayPhone1" maxlength="3" size="3">)
          <input type="text" name="dayPhone2" maxlength="3" size="3"> -
          <input type="text" name="dayPhone3" maxlength="4" size="4">
          Ext. <input type="text" name="dayPhoneExt" maxlength="5" size="5"></td></tr>
    </table>
    <p><label>Area code <input type="tel" name="eveningAreaCode" maxlength="3"></label>
       <label>Number <input type="tel" name="eveningNumber" maxlength="8"></label></p>
  </form>
</body>
</html>
