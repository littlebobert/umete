<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>한국어 레이블</title></head>
<body>
  <!-- Umete's own fixture: a Korean sign-up form. The fields' names say
       nothing, so only the Korean labels tell what each one is. -->
  <form>
    <p><label for="n1">성</label> <input id="n1" name="n1"> <label for="n2">이름</label> <input id="n2" name="n2"></p>
    <p><label for="k1">이메일 주소</label> <input type="email" id="k1" name="k1"></p>
    <p><label for="k2">휴대폰 번호</label> <input type="tel" id="k2" name="k2"></p>
    <p><label for="k3">우편번호</label> <input id="k3" name="k3"></p>
    <p><label for="k4">시/도</label> <input id="k4" name="k4"></p>
    <p><label for="k5">시/군/구</label> <input id="k5" name="k5"></p>
    <p><label for="k6">도로명 주소</label> <input id="k6" name="k6"></p>
    <p><label for="k7">상세 주소</label> <input id="k7" name="k7"></p>
  </form>
</body>
</html>
