<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>日本語のラベル</title></head>
<body>
  <!-- Umete's own fixture: a Japanese sign-up form. The fields' names say
       nothing, so only the Japanese labels tell what each one is. The kana
       reading boxes (セイ, メイ, カナ) must stay empty: the test person saved
       no readings, and a reading box never takes the name itself. -->
  <form>
    <h2>お客様情報</h2>
    <p><label for="n1">姓</label> <input id="n1" name="n1"> <label for="n2">名</label> <input id="n2" name="n2"></p>
    <p><label for="n3">セイ</label> <input id="n3" name="n3"> <label for="n4">メイ</label> <input id="n4" name="n4"></p>
    <p><label for="q1">メールアドレス（必須）</label> <input type="email" id="q1" name="q1"></p>
    <p><label for="q2">お電話番号</label> <input type="tel" id="q2" name="q2"></p>
    <h2>ご住所</h2>
    <p><label for="q3">〒 郵便番号</label> <input id="q3" name="q3"></p>
    <p><label for="q4">都道府県</label>
      <select id="q4" name="q4">
        <option value="">選択してください</option>
        <option value="CA">California</option>
        <option value="NY">New York</option>
      </select></p>
    <p><label for="q5">市区町村</label> <input id="q5" name="q5"></p>
    <p><label for="q9">市区町村（カナ）</label> <input id="q9" name="q9"></p>
    <p><label for="q6">町名・番地</label> <input id="q6" name="q6"></p>
    <p><label for="q7">建物名・部屋番号など</label> <input id="q7" name="q7"></p>
    <p><label for="q8">国・地域</label>
      <select id="q8" name="q8">
        <option value="JP">日本</option>
        <option value="US">アメリカ合衆国</option>
      </select></p>
  </form>
</body>
</html>
